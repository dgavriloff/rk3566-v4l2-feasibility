%YAML 1.2
---
$id: http://devicetree.org/schemas/media/rockchip,rk3568-rkvenc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip RKVENC (VEPU540) Video Encoder

maintainers:
  - rk3566-v4l2-feasibility contributors

description: |
  The Rockchip RKVENC is a hardware video encoder found in RK3566, RK3568,
  and RV1126 SoCs. It supports H.264 and H.265/HEVC encoding at up to
  1080p60, using a stateless encoding architecture. The encoder block is
  independent of the Hantro/Verisilicon VEPU (used for JPEG encoding) and
  has its own dedicated power domain, clocks, and IOMMU.

properties:
  compatible:
    enum:
      - rockchip,rk3568-rkvenc
      - rockchip,rv1126-rkvenc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Encoder completion/error interrupt (GIC_SPI 140 on RK356x)

  clocks:
    items:
      - description: AXI bus clock (ACLK_RKVENC)
      - description: AHB register access clock (HCLK_RKVENC)
      - description: Encoder core clock (CLK_RKVENC_CORE)

  clock-names:
    items:
      - const: aclk
      - const: hclk
      - const: core

  power-domains:
    maxItems: 1
    description: RKVENC dedicated power domain (RK3568_PD_RKVENC)

  resets:
    items:
      - description: AXI bus reset
      - description: AHB bus reset
      - description: Encoder core reset

  reset-names:
    items:
      - const: axi
      - const: ahb
      - const: core

  iommus:
    maxItems: 1
    description: |
      RKVENC has a dedicated dual-channel IOMMU at offset 0xF00/0xF40 from
      the encoder base. It should be defined as a separate rockchip,iommu
      node and referenced here.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - iommus

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/rk3568-cru.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/rk3568-power.h>

    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        rkvenc: video-codec@fdf40000 {
            compatible = "rockchip,rk3568-rkvenc";
            reg = <0x0 0xfdf40000 0x0 0x400>;
            interrupts = <GIC_SPI 140 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&cru ACLK_RKVENC>,
                     <&cru HCLK_RKVENC>,
                     <&cru CLK_RKVENC_CORE>;
            clock-names = "aclk", "hclk", "core";
            power-domains = <&power RK3568_PD_RKVENC>;
            resets = <&cru SRST_A_RKVENC>,
                     <&cru SRST_H_RKVENC>,
                     <&cru SRST_RKVENC_CORE>;
            reset-names = "axi", "ahb", "core";
            iommus = <&rkvenc_mmu>;
        };

        rkvenc_mmu: iommu@fdf40f00 {
            compatible = "rockchip,iommu";
            reg = <0x0 0xfdf40f00 0x0 0x40>,
                  <0x0 0xfdf40f40 0x0 0x40>;
            interrupts = <GIC_SPI 141 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 142 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&cru ACLK_RKVENC>, <&cru HCLK_RKVENC>;
            clock-names = "aclk", "iface";
            power-domains = <&power RK3568_PD_RKVENC>;
            #iommu-cells = <0>;
        };
    };
